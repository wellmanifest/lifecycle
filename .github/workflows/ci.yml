name: lifecycle-ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      (github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@3549d21a5a31fea87b2dd4da37d8e8bd793f20f6
    with:
      standard-ref: 3549d21a5a31fea87b2dd4da37d8e8bd793f20f6
      trusted-validator-apps: 'ifuri-validator-agent[bot]'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Validate contracts and tests
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m json.tool .governance/manifest.json >/dev/null
          python3 -m json.tool .governance/manifest.lock.json >/dev/null
          if [[ -d tests ]]; then
            PYTHONPATH=src python3 -m unittest discover -s tests -v
          fi
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            ./project/governance-check.sh --actor ci --changed-file project/TICKETS.md
          else
            base="$EVENT_BASE"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
              git fetch --no-tags origin "refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$EVENT_HEAD")"
            fi
            ./project/governance-check.sh --actor ci --base "$base" --head "$EVENT_HEAD"
          fi
      - name: Validate networkless container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t lifecycle-ci .
          docker run --rm --network none lifecycle-ci

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Run Windows governance
        shell: pwsh
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -eq '${{ github.event.repository.default_branch }}') {
            ./project.bat --actor ci --changed-file project/TICKETS.md
          } else {
            $base = $env:EVENT_BASE
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
              git fetch --no-tags origin "refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
              if ($LASTEXITCODE -ne 0) { throw 'default branch fetch failed' }
              $base = (git merge-base 'origin/${{ github.event.repository.default_branch }}' $env:EVENT_HEAD).Trim()
            }
            ./project.bat --actor ci --base $base --head $env:EVENT_HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
